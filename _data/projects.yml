# Projects: named or funded research efforts. Shown in the website "Research Projects" tab and,
# on the CV, as bullets under the role(s) in experience.yml that list their id
# (or as their own section when a profile adds `projects` to `sections`).
#
# Fields:
#   id           unique; referenced from experience.yml roles and AutoCV profiles
#   kind         project = a named/funded project (Research Projects tab); topic = a research line
#                you work on, e.g. comics, agents (Research Areas tab). Default: project
#   title        project / topic name
#   start, end   "YYYY-MM" or "YYYY"; end: present for ongoing (both optional)
#   funder       grant / funding body (optional)
#   description  website paragraph (HTML allowed)
#   cv_text      one-line CV bullet
#   refs         related publication / talk / event / code ids (code.yml) (listed on the website, "→ venue" links on the CV)
#   hide_refs    true | [talk, event, publication, code] | [ref ids] — keep refs on the website but hide them on every CV
#   links        {website, code, demo, ...} (labels in labels.yml)
#   site         false = CV only
#   tags         free-form, for CV filtering
#

