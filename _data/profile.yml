# Website bio (HTML allowed). The CV uses `summary` below instead.
bio:
  - >-
    I am part of the <a href="https://vlr.ai">Vision, Language, and Reading Group</a>,
    where I research multimodal models for document understanding.
  - >-
    My work focuses on large-scale training of vision-language models (VLMs), agentic AI systems
    that can reason and act over complex documents, and efficient VLMs for long-context document
    understanding, making it possible to process multi-page documents and large collections
    without prohibitive compute costs.

# CV summary (plain text). Profiles can override it.
summary: >-
  PhD student at the Computer Vision Center (CVC) in the Vision, Language and Reading group,
  researching multimodal models for document understanding: large-scale training of
  vision-language models, agentic systems that reason and act over complex documents, and
  efficient VLMs for long-context, multi-page document understanding.

